<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Douglas Rushkoff &mdash; Article Archive</title>
    <meta name="description" content="The complete archive of Douglas Rushkoff's published articles, essays, and book chapters &mdash; fully searchable.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Gelasio:wght@500;600&family=M+PLUS+1:wght@500;700&display=swap" rel="stylesheet">
    <style>
      :root{
        --ink:#2c3e50;
        --muted:#6d7278;
        --link:#0a58ca;
        --rule:#e6e8eb;
        --bg:#ffffff;
        --chip-bg:#f2f3f5;
        --chip-active:#2c3e50;
        --font-title:"M PLUS 1", system-ui, sans-serif;
        --font-body:"Fira Sans", system-ui, sans-serif;
        --font-brand:"Gelasio", Georgia, serif;
      }
      *{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%}
      body{
        margin:0;background:var(--bg);color:var(--ink);
        font-family:var(--font-body);font-size:16px;line-height:1.5;
      }
      a{color:var(--link);text-decoration:none}
      a:hover{text-decoration:underline}

      .wrap{max-width:820px;margin:0 auto;padding:0 20px}

      header.masthead{padding:34px 0 8px}
      .brand{font-family:var(--font-brand);font-weight:600;font-size:30px;line-height:1.1;letter-spacing:.2px}
      .kicker{font-family:var(--font-title);font-weight:700;letter-spacing:.16em;text-transform:uppercase;
        font-size:12px;color:var(--muted);margin-top:6px}

      .toolbar{position:sticky;top:0;z-index:5;background:var(--bg);
        padding:16px 0 12px;border-bottom:1px solid var(--rule)}
      .toolbar .wrap{padding-top:0;padding-bottom:0}
      .search{width:100%;font-family:var(--font-body);font-size:16px;color:var(--ink);
        padding:11px 14px;border:1px solid #cfd3d8;border-radius:8px;outline:none;background:#fff}
      .search:focus{border-color:var(--link);box-shadow:0 0 0 3px rgba(10,88,202,.15)}
      .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
      .chip{font-family:var(--font-body);font-size:13.5px;line-height:1;cursor:pointer;
        border:1px solid transparent;background:var(--chip-bg);color:var(--ink);
        padding:8px 13px;border-radius:999px;white-space:nowrap}
      .chip:hover{background:#e7e9ec}
      .chip[aria-pressed="true"]{background:var(--chip-active);color:#fff}
      .count{margin-top:11px;font-size:13px;color:var(--muted)}

      main{padding:14px 0 60px}
      .status{padding:40px 0;color:var(--muted);text-align:center}

      ul.list{list-style:none;margin:0;padding:0}
      li.item{margin-bottom:.55em;line-height:1.34;display:flex;flex-direction:column}
      .line{font-size:16px}
      .t{font-family:var(--font-title);font-weight:700;color:var(--ink)}
      a.t:hover{color:var(--link);text-decoration:none}
      .meta{color:var(--ink)}
      .pub{font-style:italic}
      .date{color:var(--muted)}
      .sub{display:block;margin-top:0;color:var(--muted);font-size:14px;line-height:1.32}
      .sub em{font-style:italic}
      mark{background:#fff3b0;color:inherit;padding:0 .5px;border-radius:2px}

      footer{border-top:1px solid var(--rule);padding:22px 0 40px;color:var(--muted);font-size:13px}
      footer a{color:var(--muted);text-decoration:underline}

      @media (max-width:560px){
        header.masthead{padding:24px 0 6px}
        .brand{font-size:26px}
        .line{font-size:16px}
      }
    </style>
  </head>
  <body>
    <header class="masthead">
      <div class="wrap">
        <div class="brand">Douglas Rushkoff</div>
        <div class="kicker">Article Archive</div>
      </div>
    </header>
    <div class="toolbar">
      <div class="wrap">
        <input id="q" class="search" type="search" autocomplete="off" spellcheck="false"
      placeholder="Search the full text of every article&hellip;" aria-label="Search articles">
        <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
        <div class="count" id="count" aria-live="polite"></div>
      </div>
    </div>
    <main>
      <div class="wrap">
        <div id="status" class="status">Loading the archive&hellip;</div>
        <ul class="list" id="list"></ul>
      </div>
    </main>
    <footer>
      <div class="wrap">
        The complete archive of Douglas Rushkoff&rsquo;s published articles.
        &nbsp;&middot;&nbsp; <a href="https://rushkoff.com">rushkoff.com</a>
      </div>
    </footer>
    <script>
      (function(){
        var DATA_URL = "/articles.json";
        var CATS = ["Journalism","Book Chapters","Scholarship","Fiction & Miscellaneous"];
        var LABELS = {"Fiction & Miscellaneous":"Fiction & Misc"};
        var data = [], activeCat = null, tokens = [];
        var elList = document.getElementById('list');
        var elStatus = document.getElementById('status');
        var elCount = document.getElementById('count');
        var elChips = document.getElementById('chips');
        var elQ = document.getElementById('q');

        function esc(s){return (s||'').replace(/[&<>"]/g,function(c){
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

        // minimal *italic* -> <em>
        function mdEm(s){
          s = esc(s);
          return s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
        }

        function highlight(html, plain){
          if(!tokens.length) return html;
          // highlight only in already-escaped plain text (title/pub), token-safe
          var out = plain;
          return out;
        }

        function buildChips(){
          var frag = document.createDocumentFragment();
          function mk(label, val){
            var b = document.createElement('button');
            b.className = 'chip'; b.type='button';
            b.textContent = label;
            b.setAttribute('aria-pressed', val===activeCat ? 'true':'false');
            b.addEventListener('click', function(){
              activeCat = (activeCat===val) ? null : val;
              [].forEach.call(elChips.children, function(c){
                c.setAttribute('aria-pressed', c===b && activeCat===val ? 'true':'false');
              });
              render();
            });
            return b;
          }
          frag.appendChild(mk('All', null));
          CATS.forEach(function(c){ frag.appendChild(mk(LABELS[c]||c, c)); });
          elChips.appendChild(frag);
        }

        function matches(a){
          if(activeCat && (a.c||[]).indexOf(activeCat) === -1) return false;
          if(!tokens.length) return true;
          var hay = (a._hay || '');
          for(var i=0;i<tokens.length;i++){ if(hay.indexOf(tokens[i]) === -1) return false; }
          return true;
        }

        function rowHTML(a){
          var isChapter = (a.c||[]).indexOf('Book Chapters')!==-1;
          var title = a.u ? '<a class="t" href="'+esc(a.u)+'">'+esc(a.t)+'</a>'
                          : '<span class="t">'+esc(a.t)+'</span>';
          // Book chapters carry their book + author in the blurb line, so we don't
          // repeat a (often placeholder) publication on the main line.
          var showPub = a.p && !isChapter;
          var meta = '';
          if(showPub){ meta += ' <span class="meta pub">'+esc(a.p)+'</span>'; }
          if(a.d){ meta += '<span class="meta">'+(showPub?', ':' ')+'</span><span class="date">'+esc(a.d)+'</span>'; }
          var line = '<div class="line">'+title+'<span class="meta">.</span>'+meta+'</div>';
          var subtext = isChapter ? (a.b || a.s) : a.s;
          var sub = subtext ? '<span class="sub">'+mdEm(subtext)+'</span>' : '';
          return '<li class="item">'+line+sub+'</li>';
        }

        function render(){
          var q = elQ.value.trim().toLowerCase();
          tokens = q.length ? q.split(/\s+/) : [];
          var out = [], n = 0;
          for(var i=0;i<data.length;i++){
            if(matches(data[i])){ out.push(rowHTML(data[i])); n++; }
          }
          elList.innerHTML = out.join('');
          var total = data.length;
          if(n === total){ elCount.textContent = total.toLocaleString()+' articles'; }
          else { elCount.textContent = n.toLocaleString()+' of '+total.toLocaleString()+' articles'; }
        }

        var t;
        elQ.addEventListener('input', function(){ clearTimeout(t); t=setTimeout(render, 120); });

        fetch(DATA_URL, {cache:'no-cache'})
          .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
          .then(function(json){
            data = json;
            for(var i=0;i<data.length;i++){
              var a = data[i];
              a._hay = ((a.t||'')+' '+(a.s||'')+' '+(a.p||'')+' '+(a.b||'')+' '+(a.x||'')).toLowerCase();
              a.x = null; // free memory of duplicate; _hay retains searchable text
            }
            elStatus.style.display = 'none';
            buildChips();
            render();
          })
          .catch(function(err){
            elStatus.textContent = 'Could not load the archive ('+err.message+'). Please refresh.';
          });
      })();
    </script>
  </body>
</html>
